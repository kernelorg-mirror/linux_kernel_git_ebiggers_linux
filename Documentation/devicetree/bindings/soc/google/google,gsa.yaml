%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/google/google,gsa.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Security Anchor (GSA)

maintainers:
  - Eric Biggers <ebiggers@kernel.org>

properties:
  compatible:
    enum:
      - google,gs101-gsa

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    gsa: gsa@17c90000 {
        compatible = "google,gs101-gsa";
        reg = <0x17c90000 0x1000>;
        interrupts = <GIC_SPI 447 IRQ_TYPE_LEVEL_HIGH>;
    };
